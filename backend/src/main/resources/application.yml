spring:
  application:
    name: relay-chat

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/relay_chat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    # P2-006 fix: Do NOT expose error messages/stack traces to clients
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLXJlbGF5LWNoYXQtc3ByaW5nYm9vdC1qd3Qtc2VjcmV0LWtleS1leGFtcGxlLTI1NmJpdA==}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000}      # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}   # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  security:
    # SECURITY FIX (§2): Comma-separated list of trusted reverse-proxy CIDRs.
    # X-Forwarded-For is ONLY consulted when the direct peer IP is in this list.
    # Empty (default) = never trust XFF, always use remoteAddr directly.
    trusted-proxies: ""

# Actuator — minimal exposure
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    com.relay: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
# Dev profile — enables DEBUG logging
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.relay: DEBUG
    org.springframework.security: DEBUG
